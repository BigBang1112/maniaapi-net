name: Live tests

# Live tests send real requests to Nadeo, ManiaPlanet, Trackmania.io, the exchanges, and the master servers.
# They run on a schedule instead of on every push, so an outage of one of those services doesn't block pull requests.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  live:
    name: Live tests
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Only net10.0 runs, so each service gets one set of requests. -f can't be passed for the whole
      # solution, because the TMX source generator targets netstandard2.0.
      # Projects without live tests run zero tests, which Microsoft Testing Platform reports as exit code 8.
      - name: Test
        env:
          MANIAAPI_LIVE_TESTS: true
          NADEO_API_LOGIN: ${{ secrets.NADEO_API_LOGIN }}
          NADEO_API_PASSWORD: ${{ secrets.NADEO_API_PASSWORD }}
          TRACKMANIA_API_CLIENTID: ${{ secrets.TRACKMANIA_API_CLIENTID }}
          TRACKMANIA_API_CLIENTSECRET: ${{ secrets.TRACKMANIA_API_CLIENTSECRET }}
          MANIAPLANET_API_CLIENTID: ${{ secrets.MANIAPLANET_API_CLIENTID }}
          MANIAPLANET_API_CLIENTSECRET: ${{ secrets.MANIAPLANET_API_CLIENTSECRET }}
        run: |
          status=0
          for project in Tests/*/*.csproj; do
            dotnet test --project "$project" -c Release -f net10.0 --treenode-filter "/*/*/*/*[Category=Live]" --ignore-exit-code 8 || status=1
          done
          exit $status
