name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      description:
        description: Text before the release notes
        type: string
        default: ""

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the release and attach the packages
      packages: write # push to GitHub Packages
      id-token: write # request the GitHub OIDC token for NuGet.org trusted publishing

    concurrency:
      group: publish-nuget-${{ github.ref }}
      cancel-in-progress: false

    steps:
      # A composite action rather than the reusable workflow, because NuGet.org matches the trusted publishing policy
      # against this workflow file, which a reusable workflow in another repository replaces with its own.
      - name: Build, test, and publish NuGet packages
        uses: bigbang1112/workflows/publish-nuget-immutable@main
        with:
          dotnet-version: latest
          project-path: Src/*/*.csproj
          test-path: Tests/*/*.csproj
          pack-path: Src/*/*.csproj
          package-prefix: ManiaAPI.
          nuget-user: ${{ vars.NUGET_USER }}
          release-description: ${{ inputs.description }}
