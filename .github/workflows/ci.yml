name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: bigbang1112/workflows/.github/workflows/dotnet-ci.yml@main
    with:
      # The test projects target net10.0, net9.0, and net8.0, so every runtime is needed.
      dotnet-version: |
        10.0.x
        9.0.x
        8.0.x
